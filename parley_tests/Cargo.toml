[package]
name = "parley_tests"
description = "Integration tests for Parley."
categories = ["gui", "graphics"]
keywords = ["text", "layout"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false

[[test]]
name = "tests"
path = "tests/mod.rs"

[features]
# Enables ICU dictionary-based word and line breaking for Thai/CJK/Khmer/Lao/Myanmar.
# CI runs `--all-features`, so the ON setting is what upstream tests; the OFF setting is what a
# plain `cargo test -p parley_tests` gets, and was never covered before this.
complex-scripts = ["parley/complex-scripts"]
system = ["parley/system"]

[dependencies]
parley = { workspace = true, features = ["std"] }
parley_dev = { workspace = true }
parley_linebreaking_cases = { workspace = true }
glifo = { workspace = true, features = ["std", "vello_cpu", "png"] }
peniko = { workspace = true, features = ["std"] }
vello_cpu = { workspace = true, features = ["std", "png"] }
fontique = { workspace = true, features = ["std"] }
icu_properties = { workspace = true, features = ["compiled_data"] }
icu_segmenter = { workspace = true, features = ["compiled_data"] }
taffy = { version = "0.10", default-features = false, features = ["std", "float_layout"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
oxipng = { version = "9.1.5", default-features = false, features = ["freestanding"] }

[lints]
workspace = true
